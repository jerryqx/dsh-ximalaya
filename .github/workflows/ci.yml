name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
      # 发布产物自检：确保 lib/ 与 cordis.patch.yml 完整进入 tarball
      - run: npm pack --dry-run
